[project]
name = "learnaai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = 'SIBTAIN\sibta', email = "sibtaincs@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.5",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "langsmith>=0.11.1",
    "mcp-use>=1.7.1",
    "mcp[cli]>=1.30.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
learnaai = "learnaai:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "langgraph-ollama-app",
]
